name: Build App
on:
  push:
    branches:
      - master
      - project-migration
  pull_request:
    branches:
      - master
jobs:
  build_android:
    name: Build Android App
    type: build
    params:
      platform: android
      profile: preview
  build_ios:
    name: Build iOS App
    type: build
    params:
      platform: ios
      profile: preview
